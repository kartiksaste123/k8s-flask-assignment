# Kubernetes Service: gives the 2 pods one stable address and load-balances
# requests between them. NodePort also opens port 30080 on every node.
apiVersion: v1
kind: Service
metadata:
  name: kartik-flask-service
  labels:
    app: kartik-flask-app
spec:
  type: NodePort
  selector:
    app: kartik-flask-app        # route to pods with this label
  ports:
    - name: http
      protocol: TCP
      port: 80                   # port inside the cluster (ClusterIP:80)
      targetPort: 5000           # container port gunicorn listens on
      nodePort: 30080            # port opened on the node (30000-32767)
