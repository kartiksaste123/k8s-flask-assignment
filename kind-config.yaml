# kind (Kubernetes IN Docker) cluster definition.
# extraPortMappings forwards host port 30080 to the NodePort 30080 inside the
# kind node container, so the Service is reachable at http://localhost:30080
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kartik-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "0.0.0.0"
        protocol: TCP
